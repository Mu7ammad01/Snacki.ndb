# API Snacki (FastAPI). Dépendances figées dans requirements.txt (mises à jour par Dependabot).
[project]
name = "snacki-api"
version = "0.3.0"
description = "API de Snacki : menu, commandes, caisse, IA"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  "pydantic",
  "pydantic-settings",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["snacki_api"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
# J14 (audit A6) : vérification des types en CI. Bibliothèques sans annotations : ignorées.
python_version = "3.12"
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["reportlab.*", "qrcode.*", "pandas.*", "defusedxml.*"]
ignore_missing_imports = true
