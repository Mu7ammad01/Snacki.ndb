# Porte 6 (en continu) : Dependabot propose une PR dès qu'une dépendance a une mise à jour.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      outils-dev:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    groups:
      api:
        patterns: ["*"]
    commit-message:
      prefix: "deps(api)"

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      web:
        patterns: ["*"]
    commit-message:
      prefix: "deps(web)"

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(docker-api)"

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(docker-web)"
