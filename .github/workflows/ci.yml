# CI de J1 : portes 1 (secrets), 2 (qualité) et tests des outils de sécurité.
# Les portes 3 à 9 s'ajoutent au fil du plan (J3, J5, J9, J12).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Moindre privilège : le jeton GitHub ne peut que lire le code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # commentaire sur la PR si un secret est trouvé
    steps:
      # Actions épinglées par empreinte de commit (une étiquette peut être déplacée, pas une empreinte).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # tout l'historique : un secret supprimé reste dans l'historique
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: python -m pip install -r requirements-dev.txt
      - name: Hooks pre-commit (ruff, bandit, hygiène, ASVS)
        # gitleaks tourne déjà dans le job « secrets » ; no-commit-to-branch n'a pas de sens en CI.
        env:
          SKIP: gitleaks,no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: python -m pip install -r requirements-dev.txt
      - name: Tests des outils de sécurité
        run: python -m pytest
