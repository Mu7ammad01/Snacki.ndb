# CI : portes 1 (secrets), 2 (qualité), 3 (tests : outils, API sur PostgreSQL, front Next.js),
# 6 (dépendances : pip-audit, npm audit) et 7 (images Docker : non root, Trivy). La porte 5 (CodeQL)
# est dans codeql.yml.
# Les portes suivantes s'ajoutent au fil du plan (J3, J5, J9, J12).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Moindre privilège : le jeton GitHub ne peut que lire le code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # commentaire sur la PR si un secret est trouvé
    steps:
      # Actions épinglées par empreinte de commit (une étiquette peut être déplacée, pas une empreinte).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # tout l'historique : un secret supprimé reste dans l'historique
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: python -m pip install -r requirements-dev.txt
      - name: Hooks pre-commit (ruff, bandit, hygiène, ASVS)
        # gitleaks tourne déjà dans le job « secrets » ; no-commit-to-branch n'a pas de sens en CI.
        env:
          SKIP: gitleaks,no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: python -m pip install -r requirements-dev.txt
      - name: Tests des outils de sécurité
        run: python -m pytest

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Même moteur qu'en production (Neon) : les tests tournent sur un vrai PostgreSQL, jetable.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snacki
          POSTGRES_PASSWORD: ci-only-not-a-secret  # base éphémère, détruite à la fin du job
          POSTGRES_DB: snacki_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snacki" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SNACKI_TEST_DATABASE_URL: postgresql://snacki:ci-only-not-a-secret@localhost:5432/snacki_test
      SNACKI_DATABASE_URL: postgresql://snacki:ci-only-not-a-secret@localhost:5432/snacki_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Installer l'API
        run: python -m pip install -r requirements-dev.txt
      - name: Migrations appliquées puis annulées (réversibles)
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Porte 2 · types Python (mypy, audit J14)
        run: python -m mypy src
      - name: Tests de l'API (couverture minimale 80 %)
        run: python -m pytest --cov --cov-report=term-missing

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Installer (versions exactes du package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Vérification des types
        run: npx tsc --noEmit
      - name: Tests (XSS, jeton, panier, message WhatsApp)
        run: npm test
      - name: Construction de production
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # J11 : un vrai navigateur (Chromium, format téléphone) rejoue les parcours du client et de la
    # caisse sur l'app construite, avec l'API et un PostgreSQL jetables. Jamais staging ni la prod.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snacki
          POSTGRES_PASSWORD: ci-only-not-a-secret  # base éphémère, détruite à la fin du job
          POSTGRES_DB: snacki_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snacki" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SNACKI_DATABASE_URL: postgresql://snacki:ci-only-not-a-secret@localhost:5432/snacki_e2e
      SNACKI_ENVIRONMENT: test
      SNACKI_SESSION_SECRET: ci-only-not-a-secret-e2e-0123456789abcdefgh
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Installer l'API et créer le schéma
        working-directory: apps/api
        run: |
          python -m pip install -r requirements.txt
          alembic upgrade head
      - name: Installer et construire le web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Installer Chromium (version liée à @playwright/test)
        run: npx playwright install --with-deps chromium
      - name: Parcours de bout en bout
        run: npx playwright test

  deps:
    name: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Installer pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Failles connues dans les dépendances Python de l'API
        run: pip-audit --strict -r apps/api/requirements.txt
      - name: Failles connues (hautes ou critiques) dans les dépendances npm livrées
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  image:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construire l'image
        run: docker build --pull -t snacki-${{ matrix.service }}:ci apps/${{ matrix.service }}
      - name: L'image tourne sans droits root
        run: |
          uid=$(docker run --rm --entrypoint id snacki-${{ matrix.service }}:ci -u)
          echo "uid=$uid"
          test "$uid" != "0"
      - name: Le dépôt n'est pas copié dans l'image (.git, tests, .env)
        run: |
          ! docker run --rm --entrypoint sh snacki-${{ matrix.service }}:ci -c 'ls -a /app' | grep -E '^(\.git|tests|\.env)$'
      - name: Porte 7 · failles connues dans l'image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: snacki-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
